name: Campus Helpdesk CI-CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: helpdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test authentication, permissions and workflows
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build the Vercel application
        run: npm run build:vercel
      - name: Build the application
        run: npm run build
      - name: Verify fresh SQL migrations
        run: node scripts/db-local.mjs .wrangler/ci-state
      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: campus-helpdesk-build
          path: dist/
          retention-days: 7
          include-hidden-files: true
  deliver:
    name: Deliver verified release
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: campus-helpdesk-build
          path: dist
      - name: Package verified build and migration instructions
        run: tar -czf campus-helpdesk-build.tar.gz dist drizzle docs README.md
      - name: Publish private repository release
        run: >-
          gh release create "$RELEASE_TAG" campus-helpdesk-build.tar.gz
          --target "$GITHUB_SHA"
          --title "Campus Helpdesk verified build $GITHUB_RUN_NUMBER"
          --notes "Automatically delivered after passing API tests, TypeScript, production build and fresh SQL migrations. This private release contains the verified build and schema. See docs/GITHUB_CICD.md for configuring a separate Cloudflare deployment."
  deploy:
    name: Deploy verified main branch
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: campus-helpdesk-build
          path: dist
      - run: node scripts/configure-deployment.mjs
      - name: Apply pending production migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --config .sites-runtime/wrangler.deploy.json
      - name: Deploy the checked build
        run: pnpm exec wrangler deploy --config .sites-runtime/wrangler.deploy.json
